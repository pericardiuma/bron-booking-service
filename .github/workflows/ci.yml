
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Check Node.js project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project syntax
        run: npm run check

      - name: Check remaining JavaScript files
        run: |
          find src scripts -type f -name "*.js" -print0 | xargs -0 -r -n1 node --check
          find public -type f -name "*.js" -print0 | xargs -0 -r -n1 node --check
