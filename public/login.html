
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Бронь без конфликтов</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #202938;
      background: #f3f5f9;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #loginMessage {
      margin: 14px 0 0;
      color: #b91c1c;
      line-height: 1.5;
    }

    .demo-accounts {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #eef0f4;
      color: #a0a7b4;
      font-size: 13px;
      line-height: 1.7;
    }

    .demo-accounts p {
      margin: 0 0 8px;
    }

    .demo-accounts strong {
      color: #8b95a5;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Бронь без конфликтов</h1>

    <p class="subtitle">
      Войди в аккаунт, чтобы просматривать ресурсы и создавать бронирования.
    </p>

    <form id="loginForm">
      <label for="login">Логин</label>
      <input
        id="login"
        name="login"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">Пароль</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Войти</button>

      <p id="loginMessage" role="alert" aria-live="polite"></p>
    </form>

    <section class="demo-accounts">
      <p><strong>Демонстрационные аккаунты</strong></p>
      <p>
        Обычный пользователь: user.demo<br>
        Пароль: UserDemo2026!
      </p>
      <p>
        Администратор: admin.demo<br>
        Пароль: AdminDemo2026!
      </p>
    </section>
  </main>

  <script src="/login.js" defer></script>
</body>
</html>
